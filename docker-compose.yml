services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cafeflow
      POSTGRES_USER: cafeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [cafeflow_pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U cafeflow -d cafeflow], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cafeflow:${POSTGRES_PASSWORD}@db:5432/cafeflow
    ports: ["8001:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are baked into the JS bundle at build time, so they must be build args.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {cafeflow_pgdata: {}}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cafeflow
      POSTGRES_USER: cafeflow
      POSTGRES_PASSWORD: cafeflow
    volumes: [cafeflow_pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U cafeflow -d cafeflow], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    env_file: .env
    ports: ["8001:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8001}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {cafeflow_pgdata: {}}

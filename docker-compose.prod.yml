# Production: docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (ports 80/443). db, api and web are internal.
name: cafeflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafeflow
      POSTGRES_USER: cafeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U cafeflow -d cafeflow], interval: 5s, timeout: 5s, retries: 10}

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://cafeflow:${POSTGRES_PASSWORD}@db:5432/cafeflow
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      # Safe because the api has no published port: only Caddy can reach it.
      FORWARDED_ALLOW_IPS: "*"
    depends_on: {db: {condition: service_healthy}}

  web:
    build:
      context: ./frontend
      args:
        # Empty = same origin: the browser calls https://$DOMAIN/api/..., routed by Caddy.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
